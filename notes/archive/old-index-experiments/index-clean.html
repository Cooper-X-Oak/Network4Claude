  <script>
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');

    const channels = [
      { name: '黑卡', cnyPerUsd: 1.5, color: '#ef4444', risk: 0.2 },
      { name: '号池', cnyPerUsd: 2.5, color: '#f97316', risk: 0.4 },
      { name: '中转', cnyPerUsd: 5, color: '#eab308', risk: 0.7 },
      { name: 'API', cnyPerUsd: 7, color: '#3b82f6', risk: 1 },
      { name: 'Pro', cost: 169, capacity: 425, color: '#10b981', type: 'plan', risk: 1 },
      { name: 'Max 5x', cost: 729, capacity: 2124, color: '#6366f1', type: 'plan', risk: 1 },
      { name: 'Max 20x', cost: 1429, capacity: 8495, color: '#8b5cf6', type: 'plan', risk: 1 }
    ];

    let currentUsage = 200;
    let bestChannel = null;
    const maxUsage = 3000;

    function getMaxCost() {
      // 动态计算 maxCost：取最高成本的 1.2 倍
      let highest = 0;
      channels.forEach(ch => {
        if (ch.type === 'plan') {
          highest = Math.max(highest, ch.cost);
        } else {
          highest = Math.max(highest, maxUsage * ch.cnyPerUsd);
        }
      });
      return Math.ceil(highest * 1.2 / 500) * 500; // 向上取整到 500 的倍数
    }

    function setupCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
    }

    function drawChart() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const pad = { l: 60, r: 40, t: 20, b: 40 };
      const cw = w - pad.l - pad.r;
      const ch = h - pad.t - pad.b;
      const maxCost = getMaxCost();

      ctx.clearRect(0, 0, w, h);

      // 背景网格
      ctx.strokeStyle = '#f3f4f6';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = pad.t + (ch / 4) * i;
        ctx.beginPath();
        ctx.moveTo(pad.l, y);
        ctx.lineTo(w - pad.r, y);
        ctx.stroke();
      }

      // Y轴标签
      ctx.fillStyle = '#6b7280';
      ctx.font = '600 11px Inter, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (let i = 0; i <= 4; i++) {
        const cost = maxCost - (maxCost / 4) * i;
        const y = pad.t + (ch / 4) * i;
        ctx.fillText(`¥${cost >= 1000 ? (cost/1000).toFixed(1) + 'k' : cost}`, pad.l - 10, y);
      }

      // X轴刻度
      ctx.fillStyle = '#6b7280';
      ctx.font = '600 10px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const xTicks = [
        { usage: 50, label: '50' },
        { usage: 200, label: '200' },
        { usage: 500, label: '500' },
        { usage: 1000, label: '1k' },
        { usage: 2000, label: '2k' }
      ];
      xTicks.forEach(tick => {
        const x = pad.l + cw * (tick.usage / maxUsage);
        ctx.fillText(tick.label, x, h - pad.b + 8);
      });

      // 绘制曲线
      channels.forEach(channel => {
        const isBest = bestChannel && channel.name === bestChannel.name;
        ctx.strokeStyle = channel.color;
        ctx.lineWidth = isBest ? 5 : 1.5;
        ctx.globalAlpha = isBest ? 1 : 0.25;
        ctx.beginPath();

        if (channel.type === 'plan') {
          const x1 = pad.l;
          const x2 = pad.l + cw * (channel.capacity / maxUsage);
          const y = pad.t + ch * (1 - channel.cost / maxCost);
          ctx.moveTo(x1, y);
          ctx.lineTo(x2, y);

          // 容量上限标记（只显示推荐方案的）
          if (isBest) {
            ctx.globalAlpha = 0.4;
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x2, pad.t);
            ctx.lineTo(x2, h - pad.b);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1;
            ctx.lineWidth = 5;
          }
        } else {
          for (let usage = 0; usage <= maxUsage; usage += 50) {
            const x = pad.l + cw * (usage / maxUsage);
            const cost = Math.min(maxCost, usage * channel.cnyPerUsd);
            const y = pad.t + ch * (1 - cost / maxCost);
            if (usage === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
        }
        ctx.stroke();
        ctx.globalAlpha = 1;

        // 只显示推荐方案的标签
        if (isBest) {
          ctx.fillStyle = channel.color;
          ctx.font = '800 14px Inter, sans-serif';
          ctx.textAlign = 'left';

          if (channel.type === 'plan') {
            // 订阅方案：标签在水平线的右端
            const labelX = pad.l + cw * (channel.capacity / maxUsage) - 80;
            const labelY = pad.t + ch * (1 - channel.cost / maxCost) - 10;
            ctx.fillText(channel.name, labelX, labelY);
          } else {
            // API 方案：标签在曲线中间
            const labelX = pad.l + cw * 0.3;
            const labelCost = 300 * channel.cnyPerUsd;
            const labelY = pad.t + ch * (1 - labelCost / maxCost) - 10;
            ctx.fillText(channel.name, labelX, labelY);
          }
        }
      });

      // 当前位置线
      const x = pad.l + cw * (currentUsage / maxUsage);
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(x, pad.t);
      ctx.lineTo(x, h - pad.b);
      ctx.stroke();
      ctx.setLineDash([]);

      // 当前位置圆点
      if (bestChannel) {
        const bestCost = bestChannel.type === 'plan' ? bestChannel.cost : currentUsage * bestChannel.cnyPerUsd;
        const y = pad.t + ch * (1 - bestCost / maxCost);
        ctx.fillStyle = bestChannel.color;
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 4;
        ctx.stroke();
      }
    }

    function findBestChannel(usage) {
      const safeChannels = channels.filter(ch => ch.risk >= 0.7);
      let best = null;
      let bestCost = Infinity;

      safeChannels.forEach(ch => {
        let cost;
        let valid = true;

        if (ch.type === 'plan') {
          if (usage > ch.capacity) {
            valid = false;
          } else {
            cost = ch.cost;
          }
        } else {
          cost = usage * ch.cnyPerUsd;
        }

        if (valid && cost < bestCost) {
          best = ch;
          bestCost = cost;
        }
      });

      return best;
    }

    function updateUI() {
      bestChannel = findBestChannel(currentUsage);

      if (currentUsage < 120) {
        usageLabel.textContent = '轻度使用';
        usageHint.textContent = '每周几次';
      } else if (currentUsage < 425) {
        usageLabel.textContent = '中度使用';
        usageHint.textContent = '每天约 20 次对话';
      } else if (currentUsage < 2124) {
        usageLabel.textContent = '重度使用';
        usageHint.textContent = '全天在线';
      } else if (currentUsage < 8495) {
        usageLabel.textContent = '极重度使用';
        usageHint.textContent = '代理编程或多人共享';
      } else {
        usageLabel.textContent = 'API 集成';
        usageHint.textContent = '大规模使用';
      }

      if (bestChannel) {
        const cost = bestChannel.type === 'plan' ? bestChannel.cost : currentUsage * bestChannel.cnyPerUsd;
        const rate = bestChannel.type === 'plan'
          ? (bestChannel.cost / currentUsage).toFixed(2)
          : bestChannel.cnyPerUsd.toFixed(2);

        planName.textContent = bestChannel.name;
        planPrice.innerHTML = `¥${Math.round(cost)}<span class="text-xl text-gray-400">/月</span>`;
        planRate.textContent = `${rate} 元 / $1 API 等值`;
      }

      drawChart();
    }

    document.querySelectorAll('.scenario-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.scenario-btn').forEach(b => {
          b.classList.remove('active');
          b.querySelector('svg').classList.remove('text-gray-900');
          b.querySelector('svg').classList.add('text-gray-400');
          b.querySelector('.text-xs').classList.remove('text-gray-900');
          b.querySelector('.text-xs').classList.add('text-gray-400');
        });

        btn.classList.add('active');
        btn.querySelector('svg').classList.remove('text-gray-400');
        btn.querySelector('svg').classList.add('text-gray-900');
        btn.querySelector('.text-xs').classList.remove('text-gray-400');
        btn.querySelector('.text-xs').classList.add('text-gray-900');

        currentUsage = Number(btn.dataset.usage);
        updateUI();
      });
    });

    window.addEventListener('resize', () => {
      setupCanvas();
      drawChart();
    });

    setupCanvas();
    updateUI();
  </script>
