<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 模型购买力计算器 - Network4Claude</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #202124;
            background: #f4f6f8;
        }

        .shell {
            max-width: 1160px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0;
            color: #5f6368;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        section {
            background: #fff;
            border: 1px solid #dde3ea;
            border-radius: 8px;
            padding: 18px;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 18px;
        }

        label {
            display: block;
            margin: 12px 0 5px;
            color: #3c4043;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #c8d0d9;
            border-radius: 6px;
            font-size: 15px;
            background: #fff;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #1769aa;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #125489;
        }

        .results {
            margin-top: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }

        th,
        td {
            padding: 9px 8px;
            border-bottom: 1px solid #e5e9ef;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: #3c4043;
            background: #f8fafc;
        }

        .metric {
            font-size: 24px;
            font-weight: 800;
            color: #1769aa;
        }

        .muted {
            color: #6f7782;
            font-size: 13px;
            line-height: 1.5;
        }

        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            background: #e8f0fe;
            color: #174ea6;
            font-size: 12px;
            font-weight: 700;
        }

        .risk {
            background: #fce8e6;
            color: #a50e0e;
        }
    </style>
</head>
<body>
    <main class="shell">
        <header>
            <h1>AI 模型购买力计算器</h1>
            <p class="subtitle">按官方 API 单价、官方 Plan API 等价模型购买力和渠道风险，统一比较不同方案。</p>
        </header>

        <div class="grid">
            <section>
                <h2>API 分项成本</h2>
                <label for="model">模型</label>
                <select id="model">
                    <option value="sonnet_4_6">Claude Sonnet 4.6</option>
                    <option value="opus_4_7">Claude Opus 4.7</option>
                    <option value="haiku_4_5">Claude Haiku 4.5</option>
                </select>

                <label for="input">Base Input (M tokens)</label>
                <input id="input" type="number" value="1100" step="0.1">

                <label for="output">Output (M tokens)</label>
                <input id="output" type="number" value="52.3" step="0.1">

                <label for="cacheRead">Cache Read (M tokens)</label>
                <input id="cacheRead" type="number" value="14700" step="0.1">

                <label for="cacheWrite5m">Cache Write 5m (M tokens)</label>
                <input id="cacheWrite5m" type="number" value="0" step="0.1">

                <label for="cacheWrite1h">Cache Write 1h (M tokens)</label>
                <input id="cacheWrite1h" type="number" value="0" step="0.1">
            </section>

            <section>
                <h2>方案购买力</h2>
                <label for="plan">官方 Plan / profile</label>
                <select id="plan">
                    <option value="chatgpt_plus">ChatGPT Plus - GPT-5.5 light chat</option>
                    <option value="chatgpt_pro_20x">ChatGPT Pro 20x - GPT-5.5 light chat</option>
                    <option value="claude_max_20x">Claude Max 20x - Sonnet code-heavy</option>
                    <option value="custom">自定义方案</option>
                </select>

                <label for="actualCost">实际成本 (CNY/月)</label>
                <input id="actualCost" type="number" value="1400" step="1">

                <label for="apiEquivalent">API 等价模型购买力 (USD/月)</label>
                <input id="apiEquivalent" type="number" value="8495" step="1">

                <label for="riskFactor">风险因子乘积</label>
                <input id="riskFactor" type="number" value="0.95" min="0" max="1" step="0.01">

                <label for="usdCny">汇率 (CNY/USD)</label>
                <input id="usdCny" type="number" value="7" step="0.01">

                <button type="button" onclick="calculate()">计算</button>
            </section>
        </div>

        <section class="results" id="results">
            <h2>结果</h2>
            <div class="grid">
                <div>
                    <div class="muted">官方 API 成本</div>
                    <div class="metric" id="apiCost">-</div>
                </div>
                <div>
                    <div class="muted">表面购买力</div>
                    <div class="metric" id="power">-</div>
                </div>
                <div>
                    <div class="muted">风险修正购买力</div>
                    <div class="metric" id="riskPower">-</div>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>项目</th>
                        <th>计算</th>
                        <th>结果</th>
                    </tr>
                </thead>
                <tbody id="breakdown"></tbody>
            </table>
        </section>
    </main>

    <script>
        const pricing = {
            opus_4_7: {
                name: "Claude Opus 4.7",
                baseInput: 5,
                cacheWrite5m: 6.25,
                cacheWrite1h: 10,
                cacheRead: 0.5,
                output: 25
            },
            sonnet_4_6: {
                name: "Claude Sonnet 4.6",
                baseInput: 3,
                cacheWrite5m: 3.75,
                cacheWrite1h: 6,
                cacheRead: 0.3,
                output: 15
            },
            haiku_4_5: {
                name: "Claude Haiku 4.5",
                baseInput: 1,
                cacheWrite5m: 1.25,
                cacheWrite1h: 2,
                cacheRead: 0.1,
                output: 5
            }
        };

        const planBaselines = {
            chatgpt_plus: { actualCost: 140, apiEquivalent: 403, riskFactor: 0.95 },
            chatgpt_pro_20x: { actualCost: 1400, apiEquivalent: 8064, riskFactor: 0.95 },
            claude_max_20x: { actualCost: 1400, apiEquivalent: 8495, riskFactor: 0.95 }
        };

        document.getElementById("plan").addEventListener("change", event => {
            const baseline = planBaselines[event.target.value];
            if (!baseline) return;
            document.getElementById("actualCost").value = baseline.actualCost;
            document.getElementById("apiEquivalent").value = baseline.apiEquivalent;
            document.getElementById("riskFactor").value = baseline.riskFactor;
        });

        function numberValue(id) {
            const value = Number.parseFloat(document.getElementById(id).value);
            return Number.isFinite(value) ? value : 0;
        }

        function money(value, currency) {
            return `${currency}${value.toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
        }

        function calculate() {
            const model = pricing[document.getElementById("model").value];
            const input = numberValue("input");
            const output = numberValue("output");
            const cacheRead = numberValue("cacheRead");
            const cacheWrite5m = numberValue("cacheWrite5m");
            const cacheWrite1h = numberValue("cacheWrite1h");
            const actualCost = numberValue("actualCost");
            const apiEquivalent = numberValue("apiEquivalent");
            const riskFactor = numberValue("riskFactor");
            const usdCny = numberValue("usdCny") || 7;

            const inputCost = input * model.baseInput;
            const outputCost = output * model.output;
            const cacheReadCost = cacheRead * model.cacheRead;
            const cacheWrite5mCost = cacheWrite5m * model.cacheWrite5m;
            const cacheWrite1hCost = cacheWrite1h * model.cacheWrite1h;
            const apiCostUsd = inputCost + outputCost + cacheReadCost + cacheWrite5mCost + cacheWrite1hCost;
            const apiCostCny = apiCostUsd * usdCny;

            const modelPower = actualCost > 0 ? apiEquivalent / actualCost : 0;
            const riskAdjustedPower = modelPower * riskFactor;

            document.getElementById("apiCost").textContent = `${money(apiCostUsd, "$")} / ${money(apiCostCny, "¥")}`;
            document.getElementById("power").textContent = `$${modelPower.toFixed(2)} / ¥1`;
            document.getElementById("riskPower").textContent = `$${riskAdjustedPower.toFixed(2)} / ¥1`;

            document.getElementById("breakdown").innerHTML = [
                ["Base Input", `${input}M × $${model.baseInput}`, money(inputCost, "$")],
                ["Output", `${output}M × $${model.output}`, money(outputCost, "$")],
                ["Cache Read", `${cacheRead}M × $${model.cacheRead}`, money(cacheReadCost, "$")],
                ["Cache Write 5m", `${cacheWrite5m}M × $${model.cacheWrite5m}`, money(cacheWrite5mCost, "$")],
                ["Cache Write 1h", `${cacheWrite1h}M × $${model.cacheWrite1h}`, money(cacheWrite1hCost, "$")],
                ["API 等价模型购买力", `${money(apiEquivalent, "$")} / ${money(actualCost, "¥")}`, `$${modelPower.toFixed(2)} / ¥1`],
                ["风险修正", `$${modelPower.toFixed(2)} × ${riskFactor}`, `<span class="pill ${riskFactor < 0.7 ? "risk" : ""}">$${riskAdjustedPower.toFixed(2)} / ¥1</span>`]
            ].map(row => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td></tr>`).join("");
        }

        calculate();
    </script>
</body>
</html>
